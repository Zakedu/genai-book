{% extends "base.html" %}

{% block announce %}
  <strong>버전 2.0</strong> · 3-AI 교차검증 반영판 — 각 문서 제목의 검증 배지를 확인하세요
{% endblock %}

{% block extrahead %}
  {{ super() }}
  {% if config.extra.chatbot %}
  <!-- 챗봇 CSS (로컬 백엔드 전용 — mkdocs.yml extra.chatbot: true 일 때만) -->
  <link rel="stylesheet" href="{{ 'assets/chatbot.css' | url }}">
  {% endif %}
{% endblock %}

{% block scripts %}
  {{ super() }}
  {% if config.extra.chatbot %}
  <!-- 챗봇 JS (로컬 백엔드 전용) -->
  <script src="{{ 'assets/chatbot.js' | url }}"></script>
  {% endif %}
{% endblock %}
